name: Build APK Irama

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan kunci tanda tangan (dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_BASE64 atau KEYSTORE_PASSWORD belum diisi. Buka Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Runner ubuntu-latest sudah punya Android SDK bawaan (ANDROID_HOME)
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Irama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Irama-APK
          path: Irama.apk
          if-no-files-found: error

      # APK juga diterbitkan di halaman Releases supaya bisa di-download langsung dari HP
      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Irama build ${{ github.run_number }}
          body: APK Irama siap pasang. Download Irama.apk di bawah ini.
          files: Irama.apk
          make_latest: true
